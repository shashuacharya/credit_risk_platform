version: "3.9"

services:
  credit-risk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neostats_credit_risk
    ports:
      - "8501:8501"
    volumes:
      # Mount your local data directory (contains Home Credit CSVs)
      - ./data:/app/data
      # Persist trained model artifacts across restarts
      - ./models:/app/models
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - DB_PATH=/app/data/credit_risk.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s